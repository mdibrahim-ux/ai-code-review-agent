name: Publish Sentinel Dashboard

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish static dashboard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Assemble static dashboard
        shell: bash
        run: |
          set -euo pipefail
          test -s dashboard/index.html
          test -s dashboard/style.css
          test -s dashboard/script.js
          mkdir -p _site
          cp dashboard/index.html dashboard/style.css dashboard/script.js _site/
          touch _site/.nojekyll
          python - <<'PY'
          from pathlib import Path
          root = Path("_site")
          for name in ("index.html", "style.css", "script.js"):
              path = root / name
              assert path.is_file() and path.stat().st_size > 0, f"missing file: {name}"
          html = (root / "index.html").read_text(encoding="utf-8")
          assert 'href="style.css"' in html, "stylesheet path must be relative"
          assert 'src="script.js"' in html, "script path must be relative"
          assert "3kbsd10ue2.execute-api.ap-south-1.amazonaws.com" in (root / "script.js").read_text(encoding="utf-8")
          print("Static dashboard files passed source-path checks.")
          PY

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
