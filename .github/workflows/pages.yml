name: Publish Sentinel Dashboard

on:
  push:
    branches:
      - main
    paths:
      - "dashboard/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish static dashboard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Assemble static dashboard
        shell: bash
        run: |
          set -euo pipefail
          test -s dashboard/index.html
          test -s dashboard/style.css
          test -s dashboard/script.js
          mkdir -p _site
          cp dashboard/index.html dashboard/style.css dashboard/script.js _site/
          touch _site/.nojekyll
          python - <<'PY'
          from pathlib import Path
          root = Path("_site")
          for name in ("index.html", "style.css", "script.js"):
              path = root / name
              assert path.is_file() and path.stat().st_size > 0, f"missing file: {name}"
          html = (root / "index.html").read_text(encoding="utf-8")
          assert 'href="style.css"' in html, "stylesheet path must be relative"
          assert 'src="script.js"' in html, "script path must be relative"
          assert "3kbsd10ue2.execute-api.ap-south-1.amazonaws.com" in (root / "script.js").read_text(encoding="utf-8")
          print("Static dashboard files passed source-path checks.")
          PY

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
