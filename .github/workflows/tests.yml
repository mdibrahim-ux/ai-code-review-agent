name: Python CI

on:
  push:
    branches:
      - main
      - test-ai-review
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run Ruff lint
        run: python -m ruff check backend tests

      - name: Compile Python files
        run: python -m compileall -q backend tests

      - name: Check patch formatting
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "${PR_BASE_SHA}...${PR_HEAD_SHA}"
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "$BEFORE_SHA" "$GITHUB_SHA"
          else
            git show --check --format=oneline --no-renames "$GITHUB_SHA"
          fi

  package:
    name: Validate Lambda Package
    runs-on: windows-latest
    needs: test
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Build and validate Lambda package
        shell: pwsh
        run: ./scripts/build_lambda_package.ps1

  aws-oidc-verify:
    name: Verify AWS OIDC Access
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::065882629492:role/github-actions-code-review-agent-deploy
          aws-region: ap-south-1
          role-session-name: GitHubActionsOIDCVerify
          allowed-account-ids: "065882629492"

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: Verify scoped Lambda read access
        shell: bash
        run: |
          set -euo pipefail
          aws lambda get-function-configuration \
            --function-name code-review-agent \
            --query '{FunctionName:FunctionName,FunctionArn:FunctionArn,Runtime:Runtime,Handler:Handler}' \
            --output json
